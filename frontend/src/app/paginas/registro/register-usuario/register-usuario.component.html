<section class="contenedorf">
    <div class="form-container">
        <h2>Registrarse</h2>
    
        <form [formGroup]="formularioRegistar" (ngSubmit) = "manejoDeRegistro()">
    
            <!-- Nombre completo -->
            <label for="nombre-completo">Nombre Completo</label>
    
            <input type="text" id="nombre-completo" name="Fullname" placeholder="Ingresa tu nombre completo" required formControlName="Fullname">
    
    
            <!-- Email -->
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="Email" placeholder="Ingresa tu correo electrónico" required formControlName="Email">

            <!-- Contraseña -->
            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" name="Password" placeholder="Ingresa tu contraseña" required formControlName="Password">
    
    
            <!-- Botón de enviar -->
            <button type="submit">Registrarse</button>
        </form>
    </div>
</section>
